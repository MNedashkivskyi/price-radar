# Docker Compose for Staging Environment Testing
# This mimics the production deployment locally

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: price_radar
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: price_radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://price_radar:secure_password_change_me@postgres:5432/price_radar
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - APP_NAME=Price Radar API
      - DEBUG=false
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY:-your-api-key}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-your-api-secret}
      - SHOPIFY_APP_URL=http://localhost:8000
      - SHOPIFY_SCOPES=read_products,write_products,read_orders
      - SHOPIFY_API_VERSION=2024-01
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-secure-32-byte-key}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
      - FRONTEND_URL=http://localhost:3000
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://price_radar:secure_password_change_me@postgres:5432/price_radar
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A price_radar.infrastructure.celery_app worker --loglevel=info

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://price_radar:secure_password_change_me@postgres:5432/price_radar
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A price_radar.infrastructure.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
