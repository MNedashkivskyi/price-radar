# GitHub Secrets Configuration Template
# Copy this file and configure in GitHub Settings → Secrets and variables → Actions

# ====================
# SECRETS (Sensitive)
# ====================

# Railway Deployment Tokens
RAILWAY_TOKEN_STAGING: "your-railway-staging-token-here"
RAILWAY_TOKEN_PRODUCTION: "your-railway-production-token-here"

# SSH Deployment - Staging
STAGING_HOST: "staging.example.com"
STAGING_USERNAME: "deploy"
STAGING_SSH_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  your-private-key-here
  -----END OPENSSH PRIVATE KEY-----
STAGING_PORT: "22"  # Optional, defaults to 22

# SSH Deployment - Production
PRODUCTION_HOST: "production.example.com"
PRODUCTION_USERNAME: "deploy"
PRODUCTION_SSH_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  your-private-key-here
  -----END OPENSSH PRIVATE KEY-----
PRODUCTION_PORT: "22"  # Optional, defaults to 22

# ====================
# VARIABLES (Non-sensitive)
# ====================

# Deployment Platform Configuration
DEPLOY_PLATFORM: "railway"  # Options: "railway" or "ssh"

# Staging Environment URLs
STAGING_BACKEND_URL: "https://staging-api.price-radar.com"
STAGING_FRONTEND_URL: "https://staging.price-radar.com"

# Production Environment URLs
PRODUCTION_BACKEND_URL: "https://api.price-radar.com"
PRODUCTION_FRONTEND_URL: "https://price-radar.com"

# ====================
# ENVIRONMENT SETUP
# ====================

# Create these environments in Settings → Environments:

# 1. staging
#    - No protection rules (auto-deploy)
#    - Add environment-specific secrets if needed

# 2. production
#    - Enable "Required reviewers" (add team members)
#    - Add 5-minute wait timer (optional)
#    - Enable "Restrict deployments to protected branches"
#    - Add environment-specific secrets if needed

# ====================
# SETUP INSTRUCTIONS
# ====================

# 1. Go to GitHub repository settings
# 2. Navigate to Secrets and variables → Actions
# 3. Add each secret from the SECRETS section above
# 4. Add each variable from the VARIABLES section above
# 5. Create environments (staging, production)
# 6. Configure environment protection rules
# 7. Test with a small deployment

# ====================
# SECURITY NOTES
# ====================

# - Never commit actual secrets to the repository
# - Rotate secrets regularly (every 90 days recommended)
# - Use separate credentials for staging and production
# - Limit SSH key access to deployment user only
# - Use read-only tokens where possible
# - Enable 2FA for accounts with deployment access
# - Review GitHub Actions logs regularly
# - Use environment protection rules for production
